<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Novara Business Intelligence</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/echarts/5.5.1/echarts.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
/* ============================================================
   NOVARA BI — Design tokens
   ============================================================ */
:root{
  --bg:#F5F7FA; --surface:#FFFFFF; --surface-2:#F9FAFC; --border:#E3E8EF; --border-strong:#CBD3DE;
  --navy:#0B1F3A; --navy-2:#132C4F; --accent:#2F6FED; --accent-soft:#E8F0FE;
  --text:#0F172A; --text-2:#475569; --text-3:#8A94A6;
  --green:#15803D; --green-soft:#E7F6EC; --red:#B91C1C; --red-soft:#FDECEC; --amber:#B45309; --amber-soft:#FEF3DC; --orange:#C2410C;
  --shadow:0 1px 2px rgba(15,23,42,.04),0 4px 14px rgba(15,23,42,.05);
  --shadow-lg:0 12px 40px rgba(11,31,58,.14);
  --radius:12px; --sidebar:236px; --header:64px;
  --font:'Inter',system-ui,sans-serif; --display:'Inter Tight','Inter',sans-serif; --mono:'JetBrains Mono',monospace;
}
[data-theme="dark"]{
  --bg:#0C1220; --surface:#141C2C; --surface-2:#1A2333; --border:#232E42; --border-strong:#33405A;
  --navy:#0A1628; --navy-2:#111F38; --accent:#5B8DEF; --accent-soft:#1B2B4A;
  --text:#E8EDF5; --text-2:#A9B4C6; --text-3:#6F7C93;
  --green:#3DBE6C; --green-soft:#12301E; --red:#F06B6B; --red-soft:#3A1A1A; --amber:#F2B04A; --amber-soft:#3A2C12;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--font);font-size:13.5px;color:var(--text);background:var(--bg);-webkit-font-smoothing:antialiased;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}
a{color:var(--accent);text-decoration:none}
h1,h2,h3,h4{font-family:var(--display);letter-spacing:-.01em}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.num{font-variant-numeric:tabular-nums}

/* Layout */
#app{display:grid;grid-template-columns:var(--sidebar) 1fr;grid-template-rows:var(--header) 1fr;height:100vh}
.sidebar{grid-row:1/3;background:var(--navy);color:#fff;display:flex;flex-direction:column;padding:18px 14px;overflow-y:auto}
.brand{display:flex;align-items:center;gap:10px;padding:6px 8px 22px}
.brand .logo{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,#2F6FED,#7BA6FF);display:flex;align-items:center;justify-content:center;font-family:var(--display);font-weight:700;font-size:16px;color:#fff;overflow:hidden}
.brand .logo img{width:100%;height:100%;object-fit:cover}
.brand .t1{font-family:var(--display);font-weight:700;font-size:14.5px;line-height:1.15}
.brand .t2{font-size:11px;color:#93A4C2;letter-spacing:.06em;text-transform:uppercase;margin-top:2px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav .sec{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:#6F86AD;padding:14px 10px 6px}
.nav a{display:flex;align-items:center;gap:11px;padding:9px 10px;border-radius:9px;color:#C7D2E6;font-weight:500;font-size:13px;transition:.15s}
.nav a svg{width:17px;height:17px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;opacity:.85}
.nav a:hover{background:rgba(255,255,255,.06);color:#fff}
.nav a.active{background:rgba(255,255,255,.12);color:#fff}
.nav a .badge{margin-left:auto;background:var(--red);color:#fff;font-size:10px;font-weight:600;padding:1px 7px;border-radius:99px}
.sidebar .foot{margin-top:auto;padding:12px 8px 0;font-size:11px;color:#6F86AD;line-height:1.5}

.header{grid-column:2;display:flex;align-items:center;gap:14px;padding:0 24px;background:var(--surface);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:30}
.header h1{font-size:17px;font-weight:600}
.header .date{font-size:12px;color:var(--text-3);margin-left:4px;white-space:nowrap}
.search{position:relative;flex:1;max-width:520px;margin-left:auto}
.search input{width:100%;height:38px;border:1px solid var(--border);border-radius:9px;padding:0 12px 0 36px;background:var(--surface-2);outline:none;transition:.15s}
.search input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.search svg{position:absolute;left:12px;top:11px;width:16px;height:16px;stroke:var(--text-3);fill:none;stroke-width:2}
.search-results{position:absolute;top:44px;left:0;right:0;background:var(--surface);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow-lg);max-height:420px;overflow:auto;display:none;z-index:50}
.search-results.open{display:block}
.search-results .grp{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--text-3);padding:10px 14px 4px}
.search-results .it{padding:8px 14px;cursor:pointer;display:flex;justify-content:space-between;gap:10px}
.search-results .it:hover{background:var(--surface-2)}
.search-results .it small{color:var(--text-3)}
.hdr-meta{font-size:11.5px;color:var(--text-3);text-align:right;line-height:1.4;white-space:nowrap}
.hdr-meta b{color:var(--text-2);font-weight:500}

.main{grid-column:2;overflow-y:auto;padding:0 24px 40px;position:relative}
.filterbar{position:sticky;top:0;z-index:20;background:var(--bg);padding:14px 0 10px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;border-bottom:1px solid var(--border);margin-bottom:18px}
.filterbar .lbl{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--text-3);margin-right:2px}
.chips{display:flex;flex-wrap:wrap;gap:6px;width:100%;padding-top:6px}
.chips:empty{display:none}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--accent-soft);color:var(--accent);border:1px solid transparent;padding:3px 9px;border-radius:99px;font-size:12px;font-weight:500}
.chip b{font-weight:600}
.chip button{font-size:14px;line-height:1;color:var(--accent);opacity:.7}
.chip button:hover{opacity:1}

/* Controls */
.btn{display:inline-flex;align-items:center;gap:7px;height:34px;padding:0 13px;border-radius:9px;border:1px solid var(--border);background:var(--surface);font-weight:500;font-size:13px;transition:.15s;white-space:nowrap}
.btn:hover{border-color:var(--border-strong);background:var(--surface-2)}
.btn.primary{background:var(--navy);color:#fff;border-color:var(--navy)}
[data-theme="dark"] .btn.primary{background:var(--accent);border-color:var(--accent)}
.btn.primary:hover{opacity:.92}
.btn.accent{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn.danger{color:var(--red);border-color:var(--red-soft);background:var(--red-soft)}
.btn.sm{height:28px;padding:0 10px;font-size:12px}
.btn.ghost{border-color:transparent;background:transparent}
.btn svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round}
.seg{display:inline-flex;border:1px solid var(--border);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg button{padding:5px 11px;font-size:12px;font-weight:500;color:var(--text-2)}
.seg button.on{background:var(--navy);color:#fff}
[data-theme="dark"] .seg button.on{background:var(--accent)}
select.sel,input.inp,textarea.inp{height:34px;border:1px solid var(--border);border-radius:9px;padding:0 10px;background:var(--surface);outline:none;min-width:120px}
textarea.inp{height:auto;padding:8px 10px}
select.sel:focus,input.inp:focus,textarea.inp:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
input[type=date].inp{min-width:140px}

/* Multi-select */
.ms{position:relative}
.ms .ms-btn{display:flex;align-items:center;gap:6px;height:34px;padding:0 10px;border:1px solid var(--border);border-radius:9px;background:var(--surface);font-size:12.5px;min-width:110px;max-width:220px}
.ms .ms-btn .v{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;text-align:left;color:var(--text-2)}
.ms .ms-btn .v.has{color:var(--text);font-weight:500}
.ms .ms-btn .cnt{background:var(--accent);color:#fff;font-size:10px;padding:1px 6px;border-radius:99px}
.ms .ms-btn .car{width:12px;height:12px;stroke:var(--text-3);fill:none;stroke-width:2}
.ms.open .ms-btn{border-color:var(--accent)}
.ms .ms-pop{display:none;position:absolute;top:38px;left:0;min-width:240px;max-width:320px;background:var(--surface);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow-lg);z-index:40;padding:8px}
.ms.open .ms-pop{display:block}
.ms .ms-pop input{width:100%;height:30px;border:1px solid var(--border);border-radius:7px;padding:0 8px;margin-bottom:6px;background:var(--surface-2);outline:none}
.ms .ms-list{max-height:260px;overflow:auto}
.ms .ms-list label{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:6px;cursor:pointer;font-size:12.5px}
.ms .ms-list label:hover{background:var(--surface-2)}
.ms .ms-list label small{margin-left:auto;color:var(--text-3)}
.ms .ms-foot{display:flex;justify-content:space-between;padding:6px 4px 0;font-size:12px}
.ms .ms-foot button{color:var(--accent);font-weight:500}

/* Pages */
.page{display:none;animation:fade .25s ease}
.page.active{display:block}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.ph h2{font-size:21px;font-weight:600}
.ph p{color:var(--text-2);margin-top:3px;font-size:13px}
.ph .acts{display:flex;gap:8px;flex-wrap:wrap}
.grid{display:grid;gap:16px}
.g5{grid-template-columns:repeat(5,1fr)}.g4{grid-template-columns:repeat(4,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g2{grid-template-columns:repeat(2,1fr)}
.g23{grid-template-columns:2fr 1fr}.g32{grid-template-columns:3fr 2fr}
.mt{margin-top:16px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow)}
.card .ch{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 18px 6px;flex-wrap:wrap}
.card .ch h3{font-size:14px;font-weight:600}
.card .ch p{font-size:12px;color:var(--text-3);margin-top:2px}
.card .cb{padding:8px 18px 16px}
.card .cb.flush{padding:0}
.chart{width:100%;height:300px}
.chart.tall{height:420px}.chart.short{height:230px}.chart.xl{height:520px}
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 20px;color:var(--text-3);text-align:center;font-size:13px;gap:8px}
.empty svg{width:34px;height:34px;stroke:var(--text-3);fill:none;stroke-width:1.6}

/* KPI */
.kpi{padding:16px 18px;position:relative;min-width:0}
.kpi .l{font-size:11.5px;color:var(--text-2);font-weight:500;display:flex;align-items:center;gap:5px}
.kpi .v{font-family:var(--display);font-size:24px;font-weight:700;margin-top:6px;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .v.sm{font-size:17px}
.kpi .d{font-size:11.5px;margin-top:6px;color:var(--text-3);display:flex;align-items:center;gap:5px}
.kpi .d .up{color:var(--green);font-weight:600}.kpi .d .dn{color:var(--red);font-weight:600}.kpi .d .nt{color:var(--text-3);font-weight:600}
.kpi .sub{font-size:11.5px;color:var(--text-3);margin-top:4px}
.info{display:inline-flex;width:14px;height:14px;border-radius:99px;border:1px solid var(--border-strong);color:var(--text-3);font-size:9.5px;align-items:center;justify-content:center;cursor:help;position:relative;font-weight:600}
.info:hover::after{content:attr(data-tip);position:absolute;left:0;top:18px;background:var(--navy);color:#fff;padding:8px 10px;border-radius:8px;font-size:11.5px;font-weight:400;width:240px;z-index:60;line-height:1.45;white-space:normal}
[title]{cursor:default}

/* Tables */
.tbl{width:100%;border-collapse:collapse;font-size:12.5px}
.tbl th{text-align:left;padding:10px 12px;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--text-3);border-bottom:1px solid var(--border);background:var(--surface-2);white-space:nowrap;cursor:pointer;user-select:none;position:sticky;top:0}
.tbl th.r,.tbl td.r{text-align:right}
.tbl th .s{font-size:9px;margin-left:3px;opacity:.6}
.tbl td{padding:9px 12px;border-bottom:1px solid var(--border);vertical-align:middle;white-space:nowrap}
.tbl tr:hover td{background:var(--surface-2)}
.tbl tr.click{cursor:pointer}
.tbl .rank{color:var(--text-3);font-weight:600;width:36px}
.tbl-wrap{overflow:auto;max-height:560px}
.tbl-foot{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;font-size:12px;color:var(--text-2);border-top:1px solid var(--border);flex-wrap:wrap;gap:8px}
.tbl-foot .pg{display:flex;gap:4px}
.tbl-foot .pg button{width:28px;height:28px;border-radius:7px;border:1px solid var(--border);font-size:12px}
.tbl-foot .pg button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.tag{display:inline-block;padding:2px 8px;border-radius:99px;font-size:11px;font-weight:600}
.tag.g{background:var(--green-soft);color:var(--green)}.tag.a{background:var(--amber-soft);color:var(--amber)}.tag.r{background:var(--red-soft);color:var(--red)}.tag.n{background:var(--surface-2);color:var(--text-2);border:1px solid var(--border)}.tag.b{background:var(--accent-soft);color:var(--accent)}
.bar{height:6px;background:var(--surface-2);border-radius:99px;overflow:hidden;min-width:70px}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px}
.bar.g i{background:var(--green)}.bar.r i{background:var(--red)}.bar.a i{background:var(--amber)}
.avatar{width:32px;height:32px;border-radius:99px;background:var(--accent-soft);color:var(--accent);display:inline-flex;align-items:center;justify-content:center;font-weight:600;font-size:12px;overflow:hidden;flex:none}
.avatar img{width:100%;height:100%;object-fit:cover}
.avatar.lg{width:88px;height:88px;font-size:28px;border-radius:20px}

/* Insights / alerts */
.ins{display:flex;flex-direction:column;gap:8px}
.ins .i{display:flex;gap:10px;padding:10px 12px;border-radius:9px;background:var(--surface-2);border:1px solid var(--border);font-size:12.5px;line-height:1.45}
.ins .i .dot{width:8px;height:8px;border-radius:99px;margin-top:5px;flex:none;background:var(--accent)}
.ins .i.pos .dot{background:var(--green)}.ins .i.neg .dot{background:var(--red)}.ins .i.warn .dot{background:var(--amber)}
.ins .i b{font-weight:600}
.alert{display:flex;gap:12px;padding:12px 14px;border-radius:10px;border:1px solid var(--border);background:var(--surface);align-items:flex-start}
.alert .k{font-size:10px;letter-spacing:.1em;font-weight:700;padding:3px 8px;border-radius:5px;flex:none;margin-top:1px}
.alert.CRITICAL .k{background:var(--red-soft);color:var(--red)}.alert.WARNING .k{background:var(--amber-soft);color:var(--amber)}.alert.OPPORTUNITY .k,.alert.POSITIVE .k{background:var(--green-soft);color:var(--green)}.alert.CONCENTRATION .k{background:var(--accent-soft);color:var(--accent)}
.alert p{font-size:12.5px;line-height:1.45}
.alert small{display:block;color:var(--text-3);margin-top:2px}

/* Profile */
.profile{display:grid;grid-template-columns:auto 1fr auto;gap:20px;padding:20px;align-items:center}
.profile .nm{font-family:var(--display);font-size:22px;font-weight:700}
.profile .meta{display:flex;gap:16px;flex-wrap:wrap;margin-top:6px;font-size:12.5px;color:var(--text-2)}
.profile .meta span b{color:var(--text);font-weight:600}
.profile .fields{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:12px}
.profile .fields label{font-size:11px;color:var(--text-3);display:block;margin-bottom:3px}
.recency{text-align:center;padding:14px 22px;border-radius:12px;min-width:180px}
.recency .n{font-family:var(--display);font-size:34px;font-weight:700;line-height:1}
.recency .t{font-size:11.5px;margin-top:4px;font-weight:500}
.recency.g{background:var(--green-soft);color:var(--green)}.recency.a{background:var(--amber-soft);color:var(--amber)}.recency.o{background:#FDE8DD;color:var(--orange)}.recency.r{background:var(--red-soft);color:var(--red)}
.score{display:flex;align-items:center;gap:14px}
.score .ring{width:74px;height:74px;border-radius:99px;display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:22px}
.score .ring i{width:58px;height:58px;border-radius:99px;background:var(--surface);display:grid;place-items:center;font-style:normal}

/* Heatmap legend, misc */
.legend{display:flex;gap:12px;font-size:11.5px;color:var(--text-2);flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.hint{font-size:12px;color:var(--text-3);line-height:1.5}
.form{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.form label{display:block;font-size:11.5px;color:var(--text-2);margin-bottom:4px;font-weight:500}
.form .full{grid-column:1/-1}
.form .inp,.form .sel{width:100%}
.benefits{display:flex;flex-wrap:wrap;gap:6px}
.benefits label{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--border);padding:4px 9px;border-radius:99px;font-size:12px;cursor:pointer}
.benefits label:has(input:checked){background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}

/* Modal / toast */
.modal-bg{position:fixed;inset:0;background:rgba(11,31,58,.45);display:none;align-items:center;justify-content:center;z-index:100;padding:20px}
.modal-bg.open{display:flex}
.modal{background:var(--surface);border-radius:16px;width:100%;max-width:760px;max-height:92vh;overflow:auto;box-shadow:var(--shadow-lg)}
.modal .mh{display:flex;align-items:center;justify-content:space-between;padding:18px 22px;border-bottom:1px solid var(--border)}
.modal .mh h3{font-size:16px}
.modal .mb{padding:20px 22px}
.modal .mf{display:flex;justify-content:flex-end;gap:8px;padding:14px 22px;border-top:1px solid var(--border)}
.modal.sm{max-width:440px}
#toast{position:fixed;bottom:22px;right:22px;display:flex;flex-direction:column;gap:8px;z-index:200}
.toast{background:var(--navy);color:#fff;padding:11px 16px;border-radius:10px;font-size:13px;box-shadow:var(--shadow-lg);animation:fade .2s;max-width:380px}
.toast.err{background:var(--red)}.toast.ok{background:var(--green)}
#loading{position:fixed;inset:0;background:rgba(255,255,255,.85);display:none;flex-direction:column;align-items:center;justify-content:center;z-index:300;gap:14px}
[data-theme="dark"] #loading{background:rgba(12,18,32,.88)}
#loading.open{display:flex}
.spin{width:36px;height:36px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:99px;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
#loading .pb{width:260px;height:6px;background:var(--border);border-radius:99px;overflow:hidden}
#loading .pb i{display:block;height:100%;background:var(--accent);width:0;transition:.2s}

/* Welcome */
.welcome{display:flex;align-items:center;justify-content:center;min-height:calc(100vh - 140px)}
.welcome .box{max-width:560px;text-align:center;padding:48px 40px;border:1px dashed var(--border-strong);border-radius:20px;background:var(--surface)}
.welcome h2{font-size:26px;margin-bottom:8px}
.welcome p{color:var(--text-2);margin-bottom:22px;line-height:1.5}
.drop{border:2px dashed var(--border-strong);border-radius:14px;padding:34px;text-align:center;color:var(--text-2);transition:.15s;cursor:pointer;background:var(--surface-2)}
.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.drop b{color:var(--accent)}

/* Org chart */
.org-wrap{position:relative;height:640px}
.org-wrap.fs{position:fixed;inset:0;z-index:90;background:var(--surface);height:100vh;border-radius:0}
.org-tools{position:absolute;top:10px;right:10px;display:flex;gap:6px;z-index:2}

/* Data tab */
.step{display:flex;gap:14px;padding:16px 0;border-bottom:1px solid var(--border)}
.step:last-child{border:none}
.step .no{width:28px;height:28px;border-radius:99px;background:var(--navy);color:#fff;display:grid;place-items:center;font-weight:600;font-size:12px;flex:none}
[data-theme="dark"] .step .no{background:var(--accent)}
.step h4{font-size:14px;margin-bottom:3px}
.step p{font-size:12.5px;color:var(--text-2);line-height:1.5;margin-bottom:10px}
.code{font-family:var(--mono);font-size:11.5px;background:var(--surface-2);border:1px solid var(--border);padding:8px 10px;border-radius:8px;white-space:pre-wrap;word-break:break-all}
.status-dot{display:inline-block;width:8px;height:8px;border-radius:99px;background:var(--text-3);margin-right:6px}
.status-dot.ok{background:var(--green)}.status-dot.bad{background:var(--red)}
.dq{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.dq div{padding:12px;border:1px solid var(--border);border-radius:10px;background:var(--surface-2)}
.dq div b{display:block;font-family:var(--display);font-size:20px;font-weight:700}
.dq div span{font-size:11.5px;color:var(--text-2)}
.dq div.bad b{color:var(--red)}.dq div.warn b{color:var(--amber)}

/* Responsive */
@media (max-width:1366px){.g5{grid-template-columns:repeat(4,1fr)}.kpi .v{font-size:21px}}
@media (max-width:1180px){.g5,.g4{grid-template-columns:repeat(3,1fr)}.g3{grid-template-columns:repeat(2,1fr)}.g23,.g32{grid-template-columns:1fr}:root{--sidebar:200px}.profile{grid-template-columns:1fr}.profile .fields{grid-template-columns:repeat(2,1fr)}}
@media (max-width:900px){#app{grid-template-columns:1fr}.sidebar{display:none}.header,.main{grid-column:1}.g5,.g4,.g3,.g2{grid-template-columns:repeat(2,1fr)}.hdr-meta{display:none}.form{grid-template-columns:1fr}.dq{grid-template-columns:repeat(2,1fr)}}
@media (max-width:600px){.g5,.g4,.g3,.g2{grid-template-columns:1fr}}
@media print{.sidebar,.header,.filterbar,.ph .acts,.btn,#toast{display:none!important}#app{display:block}.main{overflow:visible;padding:0}.page{display:none}.page.active{display:block}.card{break-inside:avoid;box-shadow:none}body{overflow:visible}}

<script>
/* ============================================================
   MODULE 0 — Utilities
   ============================================================ */
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const MONTHS=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const sum=(a,f=x=>x)=>a.reduce((s,x)=>s+(+f(x)||0),0);
const uniq=a=>[...new Set(a)];
const by=(a,f)=>{const m=new Map();for(const x of a){const k=f(x);if(!m.has(k))m.set(k,[]);m.get(k).push(x);}return m;};
const todayISO=()=>new Date().toISOString().slice(0,10);
const daysBetween=(a,b)=>Math.round((new Date(b)-new Date(a))/86400000);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const pct=(a,b)=>b?a/b*100:null;
const fmtCur=(v,full=false)=>{if(v==null||isNaN(v))return'N/A';const c=S.settings.currency||'AED';const a=Math.abs(v);const sign=v<0?'-':'';if(full)return sign+c+' '+a.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});if(a>=1e9)return sign+c+' '+(a/1e9).toFixed(2)+'B';if(a>=1e6)return sign+c+' '+(a/1e6).toFixed(2)+'M';if(a>=1e3)return sign+c+' '+(a/1e3).toFixed(a>=1e5?0:1)+'K';return sign+c+' '+a.toFixed(0);};
const fmtNum=v=>v==null||isNaN(v)?'N/A':Math.round(v).toLocaleString('en-US');
const fmtPct=(v,d=1)=>v==null||isNaN(v)||!isFinite(v)?'N/A':v.toFixed(d)+'%';
const fmtDate=iso=>{if(!iso)return'N/A';const d=new Date(iso);if(isNaN(d))return'N/A';const f=S.settings.dateFormat||'DD MMM YYYY';const dd=String(d.getDate()).padStart(2,'0'),mm=String(d.getMonth()+1).padStart(2,'0'),yy=d.getFullYear();return f==='DD/MM/YYYY'?`${dd}/${mm}/${yy}`:f==='YYYY-MM-DD'?`${yy}-${mm}-${dd}`:`${dd} ${MONTHS[d.getMonth()]} ${yy}`;};
const monthKey=iso=>iso?iso.slice(0,7):null;
const monthLbl=k=>{if(!k)return'';const[y,m]=k.split('-');return MONTHS[+m-1]+' '+y;};
const qtrOf=iso=>iso?Math.floor((+iso.slice(5,7)-1)/3)+1:null;
const yearOf=iso=>iso?+iso.slice(0,4):null;
const initials=n=>String(n||'?').split(/[\s(]+/).filter(Boolean).slice(0,2).map(s=>s[0]).join('').toUpperCase();
const debounce=(f,ms)=>{let t;return(...a)=>{clearTimeout(t);t=setTimeout(()=>f(...a),ms);};};
function toast(msg,type=''){const d=document.createElement('div');d.className='toast '+type;d.textContent=msg;$('#toast').appendChild(d);setTimeout(()=>d.remove(),3800);}
function showLoading(txt,p){const l=$('#loading');l.classList.add('open');$('#loadingTxt').textContent=txt||'Processing sales data…';$('#loadingBar').style.width=(p||0)+'%';}
function hideLoading(){$('#loading').classList.remove('open');}
function download(name,content,type='application/json'){const b=content instanceof Blob?content:new Blob([content],{type});const u=URL.createObjectURL(b);const a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),2000);}
function readFile(f,as='binary'){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;as==='binary'?r.readAsArrayBuffer(f):as==='text'?r.readAsText(f):r.readAsDataURL(f);});}
function modal(html,{cls=''}={}){const m=$('#modal');m.className='modal '+cls;m.innerHTML=html;$('#modalBg').classList.add('open');return m;}
function closeModal(){$('#modalBg').classList.remove('open');}
$('#modalBg').addEventListener('click',e=>{if(e.target.id==='modalBg')closeModal();});
function confirmDlg(title,msg,okLbl='Delete'){return new Promise(res=>{modal(`<div class="mh"><h3>${esc(title)}</h3></div><div class="mb"><p style="line-height:1.5">${msg}</p></div><div class="mf"><button class="btn" id="cNo">Cancel</button><button class="btn danger" id="cYes">${esc(okLbl)}</button></div>`,{cls:'sm'});$('#cNo').onclick=()=>{closeModal();res(false)};$('#cYes').onclick=()=>{closeModal();res(true)};});}
async function resizeImage(dataUrl,max=320){return new Promise(res=>{const im=new Image();im.onload=()=>{const s=Math.min(1,max/Math.max(im.width,im.height));const c=document.createElement('canvas');c.width=im.width*s;c.height=im.height*s;c.getContext('2d').drawImage(im,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',.85));};im.src=dataUrl;});}

/* ============================================================
   MODULE 1 — Persistent storage (IndexedDB, localStorage fallback)
   Stores: employees, mappings, settings, targets, github, salesCache
   Designed so each store maps 1:1 to a future DB table.
   ============================================================ */
const DB={name:'novara_bi',ver:1,stores:['employees','mappings','settings','targets','github','sales'],db:null,
  open(){return new Promise((res,rej)=>{if(!('indexedDB' in window))return res(null);const r=indexedDB.open(this.name,this.ver);r.onupgradeneeded=e=>{const d=e.target.result;this.stores.forEach(s=>{if(!d.objectStoreNames.contains(s))d.createObjectStore(s,{keyPath:'id'});});};r.onsuccess=e=>{this.db=e.target.result;res(this.db)};r.onerror=()=>res(null);});},
  async getAll(store){if(!this.db)return JSON.parse(localStorage.getItem('nbi_'+store)||'[]');return new Promise(res=>{const t=this.db.transaction(store).objectStore(store).getAll();t.onsuccess=()=>res(t.result||[]);t.onerror=()=>res([]);});},
  async put(store,obj){if(!this.db){const a=JSON.parse(localStorage.getItem('nbi_'+store)||'[]');const i=a.findIndex(x=>x.id===obj.id);i>=0?a[i]=obj:a.push(obj);localStorage.setItem('nbi_'+store,JSON.stringify(a));return;}return new Promise(res=>{const t=this.db.transaction(store,'readwrite');t.objectStore(store).put(obj);t.oncomplete=res;t.onerror=res;});},
  async del(store,id){if(!this.db){const a=JSON.parse(localStorage.getItem('nbi_'+store)||'[]').filter(x=>x.id!==id);localStorage.setItem('nbi_'+store,JSON.stringify(a));return;}return new Promise(res=>{const t=this.db.transaction(store,'readwrite');t.objectStore(store).delete(id);t.oncomplete=res;t.onerror=res;});},
  async clear(store){if(!this.db){localStorage.removeItem('nbi_'+store);return;}return new Promise(res=>{const t=this.db.transaction(store,'readwrite');t.objectStore(store).clear();t.oncomplete=res;t.onerror=res;});}
};

/* ============================================================
   MODULE 2 — Excel parsing (mirror of convert.py)
   ============================================================ */
const FIELD_HEADERS={sno:['s.no','sno','sr no','serial'],agent:['agent name','agent','sales person','salesperson','consultant'],date:['date of closure','closure date','booking date','date','sales date','transaction date'],property:['property','project','project name'],unit:['unit no','unit','unit number'],developer:['developer','developer name'],client:['client name','client','customer','customer name'],rm:['rm','relationship manager'],source:['source','lead source'],mop:['mode of payment','payment mode'],tokenPaid:['token paid','token'],dpStatus:['dp status','down payment status'],docStatus:['doc status','document status'],propertyValue:['property value','unit value','sale value'],commPct:['commission %','commission percent'],commPayout:['commission payout','commission'],passback:['passback','pass back'],vatInc:['vat (inclusive)','vat inclusive'],vatExc:['vat (exclusive)','vat exclusive'],gross:['gross commission','gross'],toAgent:['% to agent','agent commission'],toTL:['% to team leader'],toSH:['% to sales head'],toTele:['% to telecaller'],net:['net revenue for novara','net revenue','net'],invoice:['invoice number','invoice no','invoice'],invoiceDate:['invoice date'],team:['team','team name'],year:['year'],month:['month']};
const REQUIRED=['agent','date','developer','net','team'];
const FALLBACK={agent:1,date:2,developer:5,net:27,team:31};
const DEFAULT_ALIASES={'BAZEED KHAN':'BAZEED','SHOAIB':'SHUAIB','AWAIS (B2B)':'AWAIS','DANSIH':'DANISH','B2B (FURQAN)':'FURQAN','B2B (TABISH)':'TABISH','BILAL FAROOQ + LUV':'BILAL FAROOQ'};
const colLetter=i=>{let s='';i++;while(i){i--;s=String.fromCharCode(65+i%26)+s;i=Math.floor(i/26);}return s;};
const normH=h=>String(h??'').trim().toLowerCase().replace(/\s+/g,' ');
const cleanText=v=>{if(v==null)return null;if(v instanceof Date)return isNaN(v)?null:v.toISOString().slice(0,10);const s=String(v).replace(/\s+/g,' ').trim();return s||null;};
const cleanNum=v=>{if(v==null||v==='')return null;if(typeof v==='number')return isNaN(v)?null:v;let s=String(v).trim();const neg=s.startsWith('(')&&s.endsWith(')');s=s.replace(/,/g,'').replace(/[^0-9.\-]/g,'');if(!s||s==='-'||s==='.')return null;const n=parseFloat(s);return isNaN(n)?null:neg?-n:n;};
function parseDateAny(v){if(v==null||v==='')return null;if(v instanceof Date)return isNaN(v)?null:v.toISOString().slice(0,10);if(typeof v==='number'){if(v>20000&&v<80000){const d=new Date(Date.UTC(1899,11,30)+v*86400000);return d.toISOString().slice(0,10);}return null;}const s=String(v).trim().split(/\r?\n/)[0].trim();if(!s)return null;let m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);if(m)return`${m[1]}-${m[2].padStart(2,'0')}-${m[3].padStart(2,'0')}`;m=s.match(/^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{2,4})/);if(m){let d=+m[1],mo=+m[2],y=+m[3];if(y<100)y+=2000;if(mo>12&&d<=12)[d,mo]=[mo,d];if(mo>=1&&mo<=12&&d>=1&&d<=31)return`${y}-${String(mo).padStart(2,'0')}-${String(d).padStart(2,'0')}`;return null;}const d=new Date(s);if(isNaN(d))return null;const y=d.getFullYear();return y>=1990&&y<=2100?d.toISOString().slice(0,10):null;}
const monthIdx=v=>{const s=cleanText(v);if(!s)return null;const i=MONTHS.findIndex(m=>m.toUpperCase()===s.toUpperCase().slice(0,3));return i<0?null:i+1;};

function parseWorkbook(buf,fileName){
  const wb=XLSX.read(buf,{type:'array',cellDates:true});
  const ws=wb.Sheets[wb.SheetNames[0]];
  const rows=XLSX.utils.sheet_to_json(ws,{header:1,raw:true,defval:null});
  let hr=-1;for(let i=0;i<Math.min(15,rows.length);i++){const c=rows[i].map(normH);if(c.some(x=>x.includes('net revenue'))&&c.some(x=>x.includes('agent')||x.includes('date'))){hr=i;break;}}
  if(hr<0)throw new Error('Could not find a header row containing "Net Revenue for Novara".');
  const headers=rows[hr].map(normH);
  const map={};for(const[f,names]of Object.entries(FIELD_HEADERS)){for(const n of names){const i=headers.indexOf(n);if(i>=0){map[f]=i;break;}}}
  for(const[f,i]of Object.entries(FALLBACK))if(map[f]==null&&i<headers.length)map[f]=i;
  const missing=REQUIRED.filter(f=>map[f]==null);
  if(missing.length)throw new Error('Excel upload missing required field(s): '+missing.join(', '));
  const aliases=Object.assign({},DEFAULT_ALIASES,S.settings.aliases||{});
  const canon=v=>{const s=cleanText(v);if(!s)return null;const u=s.toUpperCase();return aliases[u]||u;};
  const get=(r,f)=>map[f]==null?null:r[map[f]];
  const q={totalRows:0,blankRows:0,valid:0,missingDate:0,estimatedDate:0,missingAgent:0,missingDeveloper:0,missingTeam:0,invalidRevenue:0,zeroRevenue:0,duplicates:0,junkRows:0};
  const seen=new Set();const txns=[];
  for(const r of rows.slice(hr+1)){q.totalRows++;if(r.every(c=>c==null||String(c).trim()==='')){q.blankRows++;continue;}
    const agent=canon(get(r,'agent'));let date=parseDateAny(get(r,'date'));let net=cleanNum(get(r,'net'));const dev=cleanText(get(r,'developer'));const team=cleanText(get(r,'team'));
    if(agent==null&&date==null&&net==null){q.junkRows++;continue;}
    let est=false;if(!date){const y=cleanNum(get(r,'year')),m=monthIdx(get(r,'month'));if(y&&m){date=`${Math.round(y)}-${String(m).padStart(2,'0')}-01`;est=true;q.estimatedDate++;}else q.missingDate++;}
    if(!agent)q.missingAgent++;if(!dev)q.missingDeveloper++;if(!team)q.missingTeam++;
    if(net==null){q.invalidRevenue++;net=0;}else if(net===0)q.zeroRevenue++;
    const key=[agent,date,dev,cleanText(get(r,'unit')),net.toFixed(2),cleanText(get(r,'client'))].join('|');const dup=seen.has(key);if(dup)q.duplicates++;seen.add(key);
    txns.push({id:txns.length+1,sno:cleanText(get(r,'sno')),agent:agent||'UNASSIGNED',agentRaw:cleanText(get(r,'agent')),date,dateEstimated:est,property:cleanText(get(r,'property')),unit:cleanText(get(r,'unit')),developer:(dev||'UNASSIGNED').toUpperCase(),client:cleanText(get(r,'client')),rm:cleanText(get(r,'rm')),source:(cleanText(get(r,'source'))||'').toUpperCase()||null,mop:(cleanText(get(r,'mop'))||'').toUpperCase()||null,tokenPaid:cleanNum(get(r,'tokenPaid')),dpStatus:cleanText(get(r,'dpStatus')),docStatus:cleanText(get(r,'docStatus')),propertyValue:cleanNum(get(r,'propertyValue')),commPct:cleanNum(get(r,'commPct')),commPayout:cleanNum(get(r,'commPayout')),passback:cleanNum(get(r,'passback')),vatInc:cleanNum(get(r,'vatInc')),vatExc:cleanNum(get(r,'vatExc')),gross:cleanNum(get(r,'gross')),toAgent:cleanNum(get(r,'toAgent')),toTL:cleanNum(get(r,'toTL')),toSH:cleanNum(get(r,'toSH')),toTele:cleanNum(get(r,'toTele')),net:net>=0?Math.floor(net*100+.5)/100:-Math.floor(-net*100+.5)/100,invoice:cleanText(get(r,'invoice')),invoiceDate:parseDateAny(get(r,'invoiceDate')),team:(team||'UNASSIGNED').toUpperCase(),duplicate:dup});q.valid++;}

/* ---------- Filtering ---------- */
function filterTx(f=S.filters,opts={}){
  let a=T();
  if(!opts.ignoreTime){
    if(f.years.length)a=a.filter(t=>t.date&&f.years.includes(yearOf(t.date)));
    if(f.quarters.length)a=a.filter(t=>t.date&&f.quarters.includes(qtrOf(t.date)));
    if(f.months.length)a=a.filter(t=>t.date&&f.months.includes(+t.date.slice(5,7)));
    if(f.from)a=a.filter(t=>t.date&&t.date>=f.from);
    if(f.to)a=a.filter(t=>t.date&&t.date<=f.to);
  }
  if(!opts.ignoreAgent&&f.agents.length)a=a.filter(t=>f.agents.includes(t.agent));
  if(!opts.ignoreTeam&&f.teams.length)a=a.filter(t=>f.teams.includes(t.team));
  if(!opts.ignoreDev&&f.developers.length)a=a.filter(t=>f.developers.includes(t.developer));
  return a;
}
/* Period bounds of current filter -> {from,to,label} or null */
function currentPeriod(){
  const f=S.filters;const dated=T().filter(t=>t.date);
  if(!dated.length)return null;
  if(f.from||f.to){const from=f.from||dated.map(t=>t.date).sort()[0];const to=f.to||todayISO();return{from,to,label:'custom'};}
  if(f.months.length&&f.years.length===1&&f.months.length===1){const y=f.years[0],m=f.months[0];return{from:`${y}-${String(m).padStart(2,'0')}-01`,to:new Date(y,m,0).toISOString().slice(0,10),label:'month'};}
  if(f.quarters.length===1&&f.years.length===1){const y=f.years[0],q=f.quarters[0];return{from:`${y}-${String((q-1)*3+1).padStart(2,'0')}-01`,to:new Date(y,q*3,0).toISOString().slice(0,10),label:'quarter'};}
  if(f.years.length===1&&!f.months.length&&!f.quarters.length){return{from:`${f.years[0]}-01-01`,to:`${f.years[0]}-12-31`,label:'year'};}
  return null; // multi-select / no time filter -> trailing 12 months comparison
}
function comparisonSets(){
  const cur=filterTx();const p=currentPeriod();
  const base=filterTx(S.filters,{ignoreTime:true});
  if(!p){const to=todayISO();const from=new Date(Date.now()-365*86400000).toISOString().slice(0,10);const pfrom=new Date(Date.now()-730*86400000).toISOString().slice(0,10);const c=base.filter(t=>t.date&&t.date>=from&&t.date<=to);const pr=base.filter(t=>t.date&&t.date>=pfrom&&t.date<from);return{cur:c,prev:pr,label:'trailing 12M vs prior 12M',curLabel:'trailing 12 months',hasTime:false};}
  const days=daysBetween(p.from,p.to)+1;let pf,pt;
  if(p.label==='month'){const d=new Date(p.from);d.setMonth(d.getMonth()-1);pf=d.toISOString().slice(0,10);pt=new Date(d.getFullYear(),d.getMonth()+1,0).toISOString().slice(0,10);}
  else if(p.label==='quarter'){const d=new Date(p.from);d.setMonth(d.getMonth()-3);pf=d.toISOString().slice(0,10);pt=new Date(d.getFullYear(),d.getMonth()+3,0).toISOString().slice(0,10);}
  else if(p.label==='year'){pf=`${+p.from.slice(0,4)-1}-01-01`;pt=`${+p.from.slice(0,4)-1}-12-31`;}
  else{pt=new Date(new Date(p.from)-86400000).toISOString().slice(0,10);pf=new Date(new Date(pt)-(days-1)*86400000).toISOString().slice(0,10);}
  const prev=base.filter(t=>t.date&&t.date>=pf&&t.date<=pt);
  return{cur,prev,label:`vs previous ${p.label}`,curLabel:p.label,hasTime:true};
}
const delta=(a,b)=>(b==null||b===0)?null:(a-b)/Math.abs(b)*100;

/* ---------- Aggregations ---------- */
function agg(list,keyF){const m=new Map();for(const t of list){const k=keyF(t);if(k==null)continue;let o=m.get(k);if(!o){o={key:k,net:0,n:0,agents:new Set(),teams:new Set(),devs:new Set(),last:null,first:null,pv:0};m.set(k,o);}o.net+=t.net;o.n++;o.agents.add(t.agent);o.teams.add(t.team);o.devs.add(t.developer);o.pv+=t.propertyValue||0;if(t.date){if(!o.last||t.date>o.last)o.last=t.date;if(!o.first||t.date<o.first)o.first=t.date;}}return[...m.values()].map(o=>({...o,agents:o.agents.size,teams:o.teams.size,devs:o.devs.size,avg:o.n?o.net/o.n:0}));}

function recencyClass(days){const s=S.settings;if(days==null)return{cls:'n',lbl:'No sales',c:'r'};if(days<=s.thAttention)return{cls:'g',lbl:'Active',c:'g'};if(days<=s.thWarning)return{cls:'a',lbl:'Attention',c:'a'};if(days<=s.thCritical)return{cls:'o',lbl:'Warning',c:'a'};return{cls:'r',lbl:'Critical',c:'r'};}

/* Agent performance score 0-100 */
function agentScore(agent,scope){
  const all=scope||filterTx(S.filters,{ignoreAgent:true});const mine=all.filter(t=>t.agent===agent);if(!mine.length)return{score:null};
  const ranked=rank(all,t=>t.agent);const n=ranked.length;const me=ranked.find(r=>r.key===agent);
  const revP=n>1?(1-(me.rank-1)/(n-1))*100:100;
  const byN=[...ranked].sort((a,b)=>b.n-a.n);const rn=byN.findIndex(r=>r.key===agent);const txP=n>1?(1-rn/(n-1))*100:100;
  const ds=daysSince(me.last);const recP=ds==null?0:clamp(100-ds/S.settings.thCritical*100,0,100);
  const months=monthRange(mine);const active=new Set(mine.filter(t=>t.date).map(t=>monthKey(t.date))).size;const tenure=months.length;
  const isNew=tenure<3;const consP=isNew?60:clamp(active/tenure*100,0,100);
  const today=new Date();const cut3=new Date(today.getFullYear(),today.getMonth()-3,1).toISOString().slice(0,10);const cut6=new Date(today.getFullYear(),today.getMonth()-6,1).toISOString().slice(0,10);
  const last3=sum(mine.filter(t=>t.date>=cut3),t=>t.net),prev3=sum(mine.filter(t=>t.date>=cut6&&t.date<cut3),t=>t.net);
  const gr=isNew||!prev3?null:delta(last3,prev3);const growP=gr==null?60:clamp(50+gr/2,0,100);
  const score=Math.round(revP*.30+txP*.20+recP*.20+consP*.15+growP*.15);
  return{score,revP,txP,recP,consP,growP,isNew,gr,active,tenure};
}

  add('agents','Agent',f.agents);add('teams','Team',f.teams);add('developers','Developer',f.developers);
  $('#chips').innerHTML=chips.join('');
}

/* ============================================================
   MODULE 6 — Insights & alerts engine
   ============================================================ */
function insights(list){
  const out=[];if(!list.length)return out;const tot=sum(list,t=>t.net);
  const ag=rank(list,t=>t.agent);const top5=sum(ag.slice(0,5),r=>r.net);if(ag.length>5)out.push({c:'',t:`Top 5 agents generated <b>${fmtPct(pct(top5,tot))}</b> of company revenue in the selected period.`});
  const dv=rank(list,t=>t.developer);if(dv.length){const d=dv[0];const sh=pct(d.net,tot);out.push({c:sh>40?'warn':'',t:`<b>${esc(d.key)}</b> is the top developer with ${fmtCur(d.net)} (${fmtPct(sh)} of revenue)${sh>40?' — concentration risk':''}.`});}
  const ms=byMonth(list);if(ms.length>=2){const cm=todayISO().slice(0,7);const partial=ms[ms.length-1].key===cm;const a=partial&&ms.length>=3?ms[ms.length-2]:ms[ms.length-1],b=partial&&ms.length>=3?ms[ms.length-3]:ms[ms.length-2];const d=delta(a.net,b.net);if(d!=null)out.push({c:d>=0?'pos':'neg',t:`Revenue ${d>=0?'grew':'fell'} <b>${fmtPct(Math.abs(d))}</b> month-on-month (${monthLbl(b.key)} → ${monthLbl(a.key)})${partial?` · ${monthLbl(cm)} is in progress: ${fmtCur(ms[ms.length-1].net)} so far`:''}.`});const best=[...ms].sort((x,y)=>y.net-x.net)[0];out.push({c:'pos',t:`<b>${monthLbl(best.key)}</b> was the strongest month with ${fmtCur(best.net)} from ${best.n} closures.`});}
  const tm=rank(list,t=>t.team);if(tm.length>1)out.push({c:'',t:`Team <b>${esc(tm[0].key)}</b> leads with ${fmtCur(tm[0].net)}; ${tm.length} teams contributed.`});
  const {cur,prev}=comparisonSets();const tq=rank(cur,t=>t.team),pq=rank(prev,t=>t.team);let bestG=null;tq.forEach(r=>{const p=pq.find(x=>x.key===r.key);if(p&&p.net>50000){const d=delta(r.net,p.net);if(d!=null&&(!bestG||d>bestG.d))bestG={k:r.key,d};}});if(bestG)out.push({c:bestG.d>=0?'pos':'neg',t:`Team <b>${esc(bestG.k)}</b> ${bestG.d>=0?'increased':'decreased'} revenue by ${fmtPct(Math.abs(bestG.d))} versus the prior period.`});
  const dormant=ag.filter(r=>daysSince(r.last)>S.settings.thWarning);if(dormant.length)out.push({c:'warn',t:`<b>${dormant.length}</b> agent${dormant.length>1?'s have':' has'} not closed a transaction in the last ${S.settings.thWarning} days.`});
  const zero=list.filter(t=>t.net===0).length;if(zero)out.push({c:'',t:`${zero} closures carry zero net revenue (pass-through / B2B deals) — excluded from averages by value, included in counts.`});
  return out;
}
function alerts(){
  const A=[];const all=filterTx();if(!all.length)return A;const tot=sum(all,t=>t.net);const today=todayISO();
  rank(T(),t=>t.agent).forEach(r=>{const d=daysSince(r.last);const em=empForAgent(r.key);if(em&&/Resigned|Terminated/.test(em.status||''))return;if(!em&&d>365)return;if(d!=null&&d>S.settings.thCritical&&r.key!=='UNASSIGNED')A.push({k:'CRITICAL',t:`Agent <b>${esc(r.key)}</b> has gone ${d} days without a transaction.`,s:`Last sale ${fmtDate(r.last)} · lifetime ${fmtCur(r.net)}`,go:()=>goto('agents',{agent:r.key})});});
  const ms=byMonth(T());if(ms.length>=3){const cm=todayISO().slice(0,7);const off=ms[ms.length-1].key===cm?1:0;const a=ms[ms.length-1-off],b=ms[ms.length-2-off];const d=delta(a.net,b.net);if(d!=null&&d<-15)A.push({k:'WARNING',t:`Company monthly revenue fell ${fmtPct(Math.abs(d))} in the last complete month.`,s:`${monthLbl(b.key)} ${fmtCur(b.net)} → ${monthLbl(a.key)} ${fmtCur(a.net)}`});const q=aggPeriod(T(),'quarter');if(q.length>=3){const cq=`${new Date().getFullYear()}-Q${qtrOf(todayISO())}`;const o=q[q.length-1].key===cq?1:0;const x=q[q.length-1-o],y=q[q.length-2-o];const dq=delta(x.net,y.net);if(dq!=null&&dq<-15)A.push({k:'WARNING',t:`Quarter-on-quarter revenue declined ${fmtPct(Math.abs(dq))} (${y.key} → ${x.key}).`});}}
  const dv=rank(all,t=>t.developer);if(dv.length){const sh=pct(dv[0].net,tot);if(sh>35)A.push({k:'CONCENTRATION',t:`Developer <b>${esc(dv[0].key)}</b> represents ${fmtPct(sh)} of company revenue.`,s:'Diversify developer mix to reduce dependency risk',go:()=>goto('developers',{developer:dv[0].key})});}
  const ag=rank(all,t=>t.agent);if(ag.length>3){const sh=pct(sum(ag.slice(0,3),r=>r.net),tot);if(sh>50)A.push({k:'CONCENTRATION',t:`Top 3 agents generate ${fmtPct(sh)} of revenue.`,s:'Key-person risk — build bench strength'});}
  const {cur,prev}=comparisonSets();const dq=rank(cur,t=>t.developer),pq=rank(prev,t=>t.developer);dq.forEach(r=>{const p=pq.find(x=>x.key===r.key);if(p&&p.net>100000){const d=delta(r.net,p.net);if(d>40)A.push({k:'OPPORTUNITY',t:`Developer <b>${esc(r.key)}</b> revenue increased ${fmtPct(d)} versus the prior period.`,s:`${fmtCur(p.net)} → ${fmtCur(r.net)}`,go:()=>goto('developers',{developer:r.key})});else if(d<-40)A.push({k:'WARNING',t:`Developer <b>${esc(r.key)}</b> revenue dropped ${fmtPct(Math.abs(d))} versus the prior period.`,s:`${fmtCur(p.net)} → ${fmtCur(r.net)}`});}});
  rank(T(),t=>t.team).forEach(tm=>{const m=byMonth(T().filter(t=>t.team===tm.key));if(m.length>=6){const last=m[m.length-1];const best=[...m].sort((a,b)=>b.net-a.net)[0];if(last.key===best.key&&last.net>0)A.push({k:'POSITIVE',t:`Team <b>${esc(tm.key)}</b> achieved its strongest month on record (${monthLbl(last.key)}, ${fmtCur(last.net)}).`,go:()=>goto('teams',{team:tm.key})});}});
  const ord={CRITICAL:0,WARNING:1,CONCENTRATION:2,OPPORTUNITY:3,POSITIVE:4};return A.sort((a,b)=>ord[a.k]-ord[b.k]);
}

function normSource(s){if(!s)return'UNKNOWN';s=s.toUpperCase();if(s.includes('BAYUT')||s.includes('DUBIZZLE'))return'BAYUT / DUBIZZLE';if(s.includes('REFER'))return'REFERRAL';if(s.includes('COLD'))return'COLD CALLING';if(s.includes('EVENT'))return'EVENTS';if(s.includes('LEAD'))return'MARKETING LEADS';if(s.includes('PERSONAL')||s.includes('CLIENT')||s.includes('SELF'))return'PERSONAL / EXISTING';if(s.includes('B2B'))return'B2B';if(s.includes('SOCIAL'))return'SOCIAL MEDIA';return'OTHER';}
function rolling(months){const list=filterTx(S.filters,{ignoreTime:true});const d=new Date();const from=new Date(d.getFullYear(),d.getMonth()-months+1,1).toISOString().slice(0,10);return sum(list.filter(t=>t.date&&t.date>=from),t=>t.net);}

function waterfall(id,steps){const cats=steps.map(s=>s[0]);let run=0;const inv=[],val=[],col=[];steps.forEach((s,i)=>{const last=i===steps.length-1;if(last){inv.push(0);val.push(Math.round(s[1]));col.push(PAL[0]);}else{if(s[1]>=0){inv.push(run);val.push(Math.round(s[1]));run+=s[1];col.push(PAL[1]);}else{run+=s[1];inv.push(run);val.push(Math.round(-s[1]));col.push('#D96C6C');}}});chart(id,{tooltip:{trigger:'axis',formatter:ps=>`<b>${esc(ps[0].axisValue)}</b><br>${fmtCur(ps[1].value,true)}`},xAxis:{type:'category',data:cats,...axisStyle(),axisLabel:{color:cssv('--text-3'),fontSize:10,interval:0,rotate:20}},yAxis:{type:'value',...moneyAxis()},series:[{type:'bar',stack:'w',data:inv,itemStyle:{color:'transparent'},barMaxWidth:36},{type:'bar',stack:'w',data:val.map((v,i)=>({value:v,itemStyle:{color:col[i],borderRadius:3}})),barMaxWidth:36}]});}

function renderAgents(){

  if(!S.sel.agent||!allAgents.includes(S.sel.agent))S.sel.agent=agents[0]?.key||allAgents[0];
  const ag=S.sel.agent;const life=T().filter(t=>t.agent===ag);const list=scope.filter(t=>t.agent===ag);const tot=sum(list,t=>t.net),ltot=sum(life,t=>t.net);const ctot=sum(scope,t=>t.net);
  const last=life.map(t=>t.date).filter(Boolean).sort().slice(-1)[0];const ds=daysSince(last);const rc=recencyClass(ds);const emp=empForAgent(ag);const sc=agentScore(ag,scope);
  const ms=byMonth(life);const bestM=[...ms].sort((a,b)=>b.net-a.net)[0];const ys=aggPeriod(life,'year');const bestY=[...ys].sort((a,b)=>b.net-a.net)[0];const tenureM=monthRange(life).length||1;
  const {cur,prev,label}=comparisonSets();const cA=sum(cur.filter(t=>t.agent===ag),t=>t.net),pA=sum(prev.filter(t=>t.agent===ag),t=>t.net);

  const al=[];if(ds!=null&&ds>S.settings.thAttention)al.push({k:ds>S.settings.thCritical?'CRITICAL':'WARNING',t:`Agent has not made a sale in ${ds} days.`});
  const today=new Date();const c6=new Date(today.getFullYear(),today.getMonth()-6,1).toISOString().slice(0,10);const c1=new Date(today.getFullYear(),today.getMonth(),1).toISOString().slice(0,10);const avg6=sum(life.filter(t=>t.date>=c6&&t.date<c1),t=>t.net)/6;const lastM=sum(life.filter(t=>t.date>=c1),t=>t.net);if(avg6>0&&lastM<avg6*.6)al.push({k:'WARNING',t:`Current month revenue is ${fmtPct(100-lastM/avg6*100)} below the 6-month monthly average (${fmtCur(avg6)}).`});
  const qs=`${today.getFullYear()}-${String(Math.floor(today.getMonth()/3)*3+1).padStart(2,'0')}-01`;if(!life.some(t=>t.date>=qs)&&life.length)al.push({k:'WARNING',t:'Zero transactions recorded in the current quarter.'});

/* generic paged/sortable/searchable table */
function pagedTable(hostId,cols,rows,{search,sortKey,desc=false,pageSize=15}={}){const host=document.getElementById(hostId);let st={q:'',page:1,sort:sortKey,desc};const draw=()=>{let r=rows;if(st.q){const q=st.q.toLowerCase();r=r.filter(x=>JSON.stringify(x).toLowerCase().includes(q));}if(st.sort){const c=cols.find(c=>(c.raw?c.raw.toString():'').includes(st.sort))||null;r=[...r].sort((a,b)=>{const va=a[st.sort]??'',vb=b[st.sort]??'';return(va<vb?-1:va>vb?1:0)*(st.desc?-1:1);});}const pages=Math.max(1,Math.ceil(r.length/pageSize));st.page=clamp(st.page,1,pages);const slice=r.slice((st.page-1)*pageSize,st.page*pageSize);host.innerHTML=tableHtml(cols,slice)+`<div class="tbl-foot"><span>${r.length} records · page ${st.page} of ${pages}</span><div class="pg">${[...Array(Math.min(pages,7))].map((_,i)=>{const p=pages<=7?i+1:clamp(st.page-3,1,pages-6)+i;return`<button data-p="${p}" class="${p===st.page?'on':''}">${p}</button>`;}).join('')}</div></div>`;$$('.pg button',host).forEach(b=>b.onclick=()=>{st.page=+b.dataset.p;draw();});$$('th',host).forEach((th,i)=>{th.onclick=()=>{const key=keyOf(cols[i]);if(!key)return;if(st.sort===key)st.desc=!st.desc;else{st.sort=key;st.desc=true;}draw();};});};const keyOf=c=>{const m=(c.raw||c.f).toString().match(/t\.([a-zA-Z]+)/);return m?m[1]:null;};if(search){const inp=$(search);if(inp)inp.oninput=debounce(()=>{st.q=inp.value;st.page=1;draw();},200);}draw();}

function orgTree(){const E=S.employees;const byName=new Map(E.map(e=>[e.name,e]));const node=(e,seen)=>{if(seen.has(e.id))return null;seen.add(e.id);const kids=E.filter(x=>x.manager===e.name&&x.id!==e.id).map(k=>node(k,seen)).filter(Boolean);return{name:e.name,value:e.id,emp:e,children:kids};};const seen=new Set();const roots=E.filter(e=>!e.manager||!byName.has(e.manager)).map(e=>node(e,seen)).filter(Boolean);return roots;}
function renderOrg(){const el=$('#page-org');const roots=orgTree();el.innerHTML=`<div class="ph"><div><h2>Organisation Chart</h2><p>Built dynamically from each employee's reporting manager · ${S.employees.length} employees</p></div><div class="acts"><input class="inp" id="orgSearch" placeholder="Find employee…"><button class="btn sm" onclick="orgFit()">Fit</button><button class="btn sm" onclick="orgExpandAll()">Expand all</button><button class="btn sm" id="orgFs">Fullscreen</button><button class="btn primary" onclick="employeeForm()">+ Add employee</button></div></div><div class="card org-wrap" id="orgWrap"><div id="orgChart" style="width:100%;height:100%"></div></div>`;

  $('#orgSearch').oninput=debounce(e=>{const q=e.target.value.toLowerCase();if(!q)return;const hit=S.employees.find(x=>x.name.toLowerCase().includes(q));if(hit){toast('Found: '+hit.name);viewEmployee(hit.id);}},500);
  $('#orgFs').onclick=()=>{const w=$('#orgWrap');w.classList.toggle('fs');$('#orgFs').textContent=w.classList.contains('fs')?'Exit fullscreen':'Fullscreen';setTimeout(resizeCharts,50);};
}

function backupObject(){return{app:'Novara Business Intelligence',version:1,exportedAt:new Date().toISOString(),employees:S.employees,mappings:S.mappings,targets:S.targets,settings:S.settings,github:{...S.github,token:undefined}};}

async function restoreBackupFile(f){try{const o=JSON.parse(await readFile(f,'text'));if(!o.employees&&!o.transactions)throw new Error('Not a Novara backup or data.json file');if(o.transactions){S.data=o;await DB.put('sales',{id:'current',data:o});resetFilters();afterDataLoad();return toast('data.json loaded','ok');}if(!await confirmDlg('Restore backup?',`This will replace ${S.employees.length} employee records, mappings, targets and settings with the backup from ${fmtDate(o.exportedAt)}.`,'Restore'))return;await DB.clear('employees');await DB.clear('mappings');await DB.clear('targets');S.employees=o.employees||[];for(const e of S.employees)await DB.put('employees',e);S.mappings=o.mappings||{};for(const[a,eid]of Object.entries(S.mappings))await DB.put('mappings',{id:a,empId:eid});S.targets=o.targets||[];for(const t of S.targets)await DB.put('targets',t);if(o.settings){S.settings={...S.settings,...o.settings};await DB.put('settings',{id:'app',...S.settings});applyTheme();}toast('Backup restored','ok');renderPage();}catch(e){toast(e.message,'err');}}

/* ---- GitHub auto-publish (Contents API) ---- */
const gh={api:'https://api.github.com',
  hdr(){return{Authorization:'Bearer '+S.github.token,Accept:'application/vnd.github+json','Content-Type':'application/json'};},
  async test(){const r=await fetch(`${this.api}/repos/${S.github.owner}/${S.github.repo}`,{headers:this.hdr()});if(!r.ok)throw new Error(r.status===401?'Token rejected (401). Check the token and its Contents: read/write permission.':r.status===404?'Repository not found (404). Check owner/repo, or the token lacks access.':'GitHub error '+r.status);return r.json();},
  async putFile(path,content,message){const url=`${this.api}/repos/${S.github.owner}/${S.github.repo}/contents/${path.replace(/^\//,'')}`;let sha;const g=await fetch(url+`?ref=${encodeURIComponent(S.github.branch||'main')}`,{headers:this.hdr()});if(g.ok)sha=(await g.json()).sha;const b64=btoa(unescape(encodeURIComponent(content)));const r=await fetch(url,{method:'PUT',headers:this.hdr(),body:JSON.stringify({message,content:b64,branch:S.github.branch||'main',sha})});if(!r.ok){const j=await r.json().catch(()=>({}));throw new Error('Publish failed: '+(j.message||r.status));}return r.json();}
};

async function publishToGitHub(silent){if(!S.data)return toast('No data to publish','err');if(!S.github.token||!S.github.owner||!S.github.repo)return toast('Configure GitHub in the Data tab first','err');try{if(!silent)showLoading('Publishing data.json to GitHub…',50);const msg=`Update ${S.github.path||'data.json'} — ${S.data.meta.sourceFile} · ${S.data.meta.quality.valid} transactions`;await gh.putFile(S.github.path||'data.json',dataJsonString(),msg);if(S.github.backupPath)await gh.putFile(S.github.backupPath,JSON.stringify(backupObject(),null,1),'Update dashboard backup');S.github.lastPublish=new Date().toISOString();await DB.put('github',{id:'cfg',...S.github,token:S.github.remember?S.github.token:''});hideLoading();toast('Published to GitHub — live site updates in ~1 minute','ok');if(S.page==='data')renderData();}catch(e){hideLoading();toast(e.message,'err');}}

  el.innerHTML=`<div class="ph"><div><h2>Data</h2><p>Upload sales data, export data.json, download the Excel template and connect GitHub for auto-publishing</p></div></div>
  <div class="grid g32">
  <div class="card"><div class="cb" style="padding:6px 22px 10px">
    <div class="step"><div class="no">1</div><div style="flex:1"><h4>Upload sales Excel</h4><p>Replaces the sales dataset only. Employee records, photos, mappings, targets and settings are kept. Columns are matched by header name; validation results appear below.</p><div class="drop" id="dropData"><b>Choose Excel file</b> or drag it here<br><span class="hint">.xlsx · headers on row 2 · required: Agent Name, Date of Closure, Developer, Net Revenue for Novara, Team</span></div>${m?`<div class="hint mt">Currently loaded: <b>${esc(m.sourceFile)}</b> · sheet "${esc(m.sheet)}" · ${fmtDate(m.generatedAt)} · generated by ${esc(m.generatedBy)}</div>`:''}</div></div>

    <div class="step"><div class="no">3</div><div style="flex:1"><h4>Download sample Excel</h4><p>A template workbook with the exact header layout the dashboard expects, seeded with the first rows of your current data plus a README sheet.</p><button class="btn" onclick="downloadSampleExcel()">Download sample Excel</button></div></div>
    <div class="step"><div class="no">4</div><div style="flex:1"><h4>Connect GitHub (auto-publish)</h4><p>When connected, every Excel upload writes <span class="mono">data.json</span> straight into your repository — no manual download/upload. Create a fine-grained personal access token (GitHub → Settings → Developer settings → Fine-grained tokens) scoped to this one repository with <b>Contents: Read and write</b>.</p>
      <div class="form"><div><label>Repository owner (user or org)</label><input class="inp" id="gh_owner" value="${esc(g.owner||'')}" placeholder="novara-properties"></div><div><label>Repository name</label><input class="inp" id="gh_repo" value="${esc(g.repo||'')}" placeholder="novara-bi"></div><div><label>Branch</label><input class="inp" id="gh_branch" value="${esc(g.branch||'main')}"></div><div><label>Path to data.json in repo</label><input class="inp" id="gh_path" value="${esc(g.path||'data.json')}"></div><div class="full"><label>Personal access token</label><input class="inp" type="password" id="gh_token" value="${esc(g.token||'')}" placeholder="github_pat_…"></div><div><label>Also publish backup to (optional path)</label><input class="inp" id="gh_backup" value="${esc(g.backupPath||'')}" placeholder="backup/novara_backup.json"></div><div style="display:flex;flex-direction:column;gap:8px;justify-content:flex-end"><label style="display:flex;gap:8px;align-items:center;font-size:12.5px"><input type="checkbox" id="gh_auto" ${g.auto?'checked':''}> Auto-publish after every Excel upload</label><label style="display:flex;gap:8px;align-items:center;font-size:12.5px"><input type="checkbox" id="gh_remember" ${g.remember!==false?'checked':''}> Remember token in this browser</label></div></div>
      <div class="toolbar mt"><button class="btn" onclick="saveGithub()">Save</button><button class="btn" onclick="testGithub()">Test connection</button><button class="btn primary" onclick="publishToGitHub()">Publish data.json now</button><span class="hint"><span class="status-dot ${g.ok?'ok':g.token?'':'bad'}"></span>${g.ok?'Connected':g.token?'Not tested':'Not connected'}${g.lastPublish?' · last publish '+new Date(g.lastPublish).toLocaleString():''}</span></div>
      <p class="hint mt">Security: the token is stored only in this browser's local database and sent only to api.github.com. Use a fine-grained token limited to one repository, and revoke it from GitHub at any time. Anyone with access to this browser profile could publish to the repo.</p></div></div>
  </div></div>
  <div><div class="card"><div class="ch"><div><h3>Data Quality</h3><p>Is the dashboard trustworthy?</p></div></div><div class="cb">${q?`<div class="dq"><div><b>${fmtNum(q.totalRows)}</b><span>rows read</span></div><div><b>${fmtNum(q.valid)}</b><span>valid transactions</span></div><div class="${q.estimatedDate?'warn':''}"><b>${q.estimatedDate}</b><span>dates estimated from Year/Month</span></div><div class="${q.missingDate?'bad':''}"><b>${q.missingDate}</b><span>rows with no usable date</span></div><div class="${q.missingAgent?'bad':''}"><b>${q.missingAgent}</b><span>missing agent</span></div><div class="${q.missingDeveloper?'warn':''}"><b>${q.missingDeveloper}</b><span>missing developer</span></div><div class="${q.missingTeam?'warn':''}"><b>${q.missingTeam}</b><span>missing team</span></div><div class="${q.invalidRevenue?'bad':''}"><b>${q.invalidRevenue}</b><span>invalid revenue (treated as 0)</span></div><div><b>${q.zeroRevenue}</b><span>zero-revenue closures</span></div><div class="${q.duplicates?'warn':''}"><b>${q.duplicates}</b><span>possible duplicates (kept, flagged)</span></div><div><b>${q.blankRows}</b><span>blank rows skipped</span></div><div class="${unmatched?'warn':''}"><b>${unmatched}</b><span>agent names without employee</span></div></div>`:'<div class="empty">No data loaded.</div>'}</div></div>
  <div class="card mt"><div class="ch"><div><h3>Column Mapping</h3><p>Detected by header name</p></div></div><div class="cb flush">${m?tableHtml([{h:'Dashboard field',f:r=>`<b>${esc(r[0])}</b>`},{h:'Excel column',f:r=>`<span class="mono">${esc(r[1].letter)}</span>`},{h:'Header',f:r=>esc(r[1].header)}],['agent','date','developer','net','team','property','unit','client','propertyValue','gross','toAgent','invoice','source'].filter(f=>m.columnMap[f]).map(f=>[f,m.columnMap[f]])):''}</div></div>
  <div class="card mt"><div class="ch"><div><h3>Backup / Restore</h3><p>All non-sales data as JSON</p></div></div><div class="cb"><div class="toolbar"><button class="btn primary" onclick="downloadBackup()">Download backup</button><button class="btn" onclick="$('#jsonInput').click()">Restore backup</button></div><p class="hint mt">Includes employees, photos, org relationships, contract types, salaries, benefits, statuses, agent mappings, targets and settings.</p></div></div>
  ${S.data?.expenses&&Object.keys(S.data.expenses).length?`<div class="card mt"><div class="ch"><div><h3>Expense Summary (from workbook)</h3><p>Sheet ${esc(Object.keys(S.data.expenses).join(', '))}</p></div></div><div class="cb"><div id="expChart" class="chart"></div><div id="expNote" class="hint mt"></div></div></div>`:''}
  </div></div>`;
  if(S.data?.expenses){const yr=Object.keys(S.data.expenses).sort().slice(-1)[0];const items=[...S.data.expenses[yr]].sort((a,b)=>b.amount-a.amount);hbar('expChart',items.slice(0,12).map(i=>({key:i.category,net:i.amount})));const rev=sum(T().filter(t=>yearOf(t.date)===+yr),t=>t.net);const mkt=sum(items.filter(i=>/facebook|instagram|linkedin|bayut|event|google|social/i.test(i.category)),i=>i.amount);const totalExp=sum(items,i=>i.amount);$('#expNote').innerHTML=`${yr}: total recorded expenses ${fmtCur(totalExp)} vs net revenue ${fmtCur(rev)} → operating margin ${fmtPct(pct(rev-totalExp,rev))}. Marketing & lead-gen spend ${fmtCur(mkt)} = ${fmtPct(pct(mkt,rev),1)} of net revenue (blended marketing ROAS ${rev&&mkt?(rev/mkt).toFixed(1)+'×':'N/A'} on net revenue).`;}
}

/* ============================================================
   MODULE 12 — Settings & Targets
   ============================================================ */
function renderSettings(){const el=$('#page-settings');const s=S.settings;const years=uniq(T().map(t=>yearOf(t.date)).filter(Boolean)).sort();const teams=uniq(T().map(t=>t.team)).sort(),agents=uniq(T().map(t=>t.agent)).sort();
  el.innerHTML=`<div class="ph"><div><h2>Settings</h2><p>Dashboard preferences, thresholds, agent aliases and targets</p></div></div>
  <div class="grid g2"><div class="card"><div class="ch"><div><h3>Company & display</h3></div></div><div class="cb"><div class="form"><div><label>Company name</label><input class="inp" id="st_company" value="${esc(s.company)}"></div><div><label>Currency</label><input class="inp" id="st_currency" value="${esc(s.currency)}"></div><div><label>Date format</label><select class="sel" id="st_dateFormat">${['DD MMM YYYY','DD/MM/YYYY','YYYY-MM-DD'].map(f=>`<option ${s.dateFormat===f?'selected':''}>${f}</option>`).join('')}</select></div><div><label>Default dashboard year</label><select class="sel" id="st_defaultYear"><option value="">All years</option>${years.map(y=>`<option ${String(s.defaultYear)===String(y)?'selected':''}>${y}</option>`).join('')}</select></div><div><label>Theme</label><select class="sel" id="st_theme">${['light','dark'].map(f=>`<option ${s.theme===f?'selected':''}>${f}</option>`).join('')}</select></div><div><label>Logo</label><div class="toolbar"><button class="btn sm" id="st_logo">Upload logo</button>${s.logo?'<button class="btn sm ghost" id="st_logoRm">Remove</button>':''}</div></div></div>
  <h4 class="mt" style="font-size:13px">Activity thresholds (days since last sale)</h4><div class="form mt" style="grid-template-columns:repeat(3,1fr)"><div><label>Active up to</label><input type="number" class="inp" id="st_thAttention" value="${s.thAttention}"></div><div><label>Attention up to</label><input type="number" class="inp" id="st_thWarning" value="${s.thWarning}"></div><div><label>Warning up to (then Critical)</label><input type="number" class="inp" id="st_thCritical" value="${s.thCritical}"></div></div>
  <h4 class="mt" style="font-size:13px">Agent name aliases <span class="info" data-tip="Merge spelling variants from Excel into one agent. Format: one per line, VARIANT = CANONICAL. Applied on the next Excel upload.">i</span></h4><textarea class="inp mt" id="st_aliases" rows="5" style="width:100%">${esc(Object.entries({...DEFAULT_ALIASES,...s.aliases}).map(([a,b])=>a+' = '+b).join('\n'))}</textarea>
  <div class="toolbar mt"><button class="btn primary" id="st_save">Save settings</button></div></div></div>
  <div class="card"><div class="ch"><div><h3>Targets</h3><p>Monthly net revenue targets · progress shown on the Executive Summary</p></div></div><div class="cb"><div class="form" style="grid-template-columns:1fr 1fr 1fr auto;align-items:end"><div><label>Scope</label><select class="sel" id="tg_scope" style="width:100%"><option value="company">Company</option><option value="team">Team</option><option value="agent">Agent</option></select></div><div><label>Name</label><select class="sel" id="tg_name" style="width:100%"><option>—</option></select></div><div><label>Monthly target (${esc(s.currency)})</label><input type="number" class="inp" id="tg_amount" style="width:100%"></div><div><button class="btn primary" id="tg_add">Add</button></div></div><div class="mt" id="tg_list"></div></div></div></div>`;
  const nameSel=$('#tg_name');const fill=()=>{const sc=$('#tg_scope').value;nameSel.innerHTML=sc==='company'?'<option value="company">Company</option>':(sc==='team'?teams:agents).map(x=>`<option>${esc(x)}</option>`).join('');};fill();$('#tg_scope').onchange=fill;
  const drawT=()=>{$('#tg_list').innerHTML=S.targets.length?tableHtml([{h:'Scope',f:t=>`<span class="tag b">${esc(t.scope)}</span>`},{h:'Name',f:t=>`<b>${esc(t.name)}</b>`},{h:'Monthly target',r:1,f:t=>fmtCur(t.amount,true)},{h:'',f:t=>`<button class="btn sm danger" onclick="removeTarget('${t.id}')">Remove</button>`}],S.targets):'<div class="hint">No targets yet.</div>';};drawT();
  $('#tg_add').onclick=async()=>{const t={id:'tg_'+Date.now(),scope:$('#tg_scope').value,name:$('#tg_name').value,amount:+$('#tg_amount').value};if(!t.amount)return toast('Enter a target amount','err');S.targets=S.targets.filter(x=>!(x.scope===t.scope&&x.name===t.name));S.targets.push(t);await DB.put('targets',t);drawT();toast('Target saved','ok');};
  $('#st_logo').onclick=()=>{$('#imgInput').onchange=async e=>{const f=e.target.files[0];if(!f)return;s.logo=await resizeImage(await readFile(f,'dataurl'),160);await DB.put('settings',{id:'app',...s});applyTheme();renderSettings();e.target.value='';};$('#imgInput').click();};if($('#st_logoRm'))$('#st_logoRm').onclick=async()=>{s.logo=null;await DB.put('settings',{id:'app',...s});applyTheme();renderSettings();};
  $('#st_save').onclick=async()=>{['company','currency','dateFormat','defaultYear','theme'].forEach(k=>s[k]=$('#st_'+k).value);['thAttention','thWarning','thCritical'].forEach(k=>s[k]=+$('#st_'+k).value||s[k]);const al={};$('#st_aliases').value.split('\n').forEach(l=>{const[a,b]=l.split('=').map(x=>(x||'').trim().toUpperCase());if(a&&b)al[a]=b;});s.aliases=al;await DB.put('settings',{id:'app',...s});applyTheme();toast('Settings saved','ok');buildFilters();renderPage();};}
async function removeTarget(id){S.targets=S.targets.filter(t=>t.id!==id);await DB.del('targets',id);renderSettings();}
function targetsHtml(){if(!S.targets.length||!T().length)return'';const d=new Date();const mk=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;const p=currentPeriod();const months=p?Math.max(1,Math.round((new Date(p.to)-new Date(p.from))/2592000000)):1;const list=p?filterTx():T().filter(t=>monthKey(t.date)===mk);const lbl=p?`selected period (${months} month${months>1?'s':''})`:monthLbl(mk);return`<div class="card mt"><div class="ch"><div><h3>Target Achievement</h3><p>Actual vs monthly targets · ${esc(lbl)}</p></div><button class="btn sm ghost" onclick="goto('settings')">Manage targets</button></div><div class="cb"><div class="grid g3">${S.targets.map(t=>{const actual=sum(list.filter(x=>t.scope==='company'||(t.scope==='team'?x.team===t.name:x.agent===t.name)),x=>x.net);const target=t.amount*months;const ach=pct(actual,target)||0;return`<div style="padding:12px;border:1px solid var(--border);border-radius:10px"><div style="display:flex;justify-content:space-between;font-size:12.5px"><b>${esc(t.name)}</b><span class="tag ${ach>=100?'g':ach>=70?'a':'r'}">${fmtPct(ach,0)}</span></div><div class="bar mt ${ach>=100?'g':ach>=70?'a':'r'}" style="margin-top:8px"><i style="width:${clamp(ach,0,100)}%"></i></div><div class="hint" style="margin-top:6px">Actual ${fmtCur(actual)} · Target ${fmtCur(target)} · Variance ${fmtCur(actual-target)}</div></div>`;}).join('')}</div></div></div>`;}

/* ============================================================
   MODULE 13 — Global search, theme, bootstrap
   ============================================================ */
function globalSearch(q){const box=$('#gresults');if(!q||q.length<2||!S.data)return box.classList.remove('open');q=q.toLowerCase();const grp=[];const add=(t,items)=>{if(items.length)grp.push({t,items:items.slice(0,6)});};const all=T();
  add('Agents',uniq(all.map(t=>t.agent)).filter(a=>a.toLowerCase().includes(q)).map(a=>({l:a,s:fmtCur(sum(all.filter(t=>t.agent===a),t=>t.net)),go:()=>goto('agents',{agent:a})})));
  add('Teams',uniq(all.map(t=>t.team)).filter(a=>a.toLowerCase().includes(q)).map(a=>({l:a,s:fmtCur(sum(all.filter(t=>t.team===a),t=>t.net)),go:()=>goto('teams',{team:a})})));
  add('Developers',uniq(all.map(t=>t.developer)).filter(a=>a.toLowerCase().includes(q)).map(a=>({l:a,s:fmtCur(sum(all.filter(t=>t.developer===a),t=>t.net)),go:()=>goto('developers',{developer:a})})));
  add('Projects',uniq(all.map(t=>t.property).filter(Boolean)).filter(a=>a.toLowerCase().includes(q)).map(a=>({l:a,s:uniq(all.filter(t=>t.property===a).map(t=>t.developer)).join(', '),go:()=>{const d=all.find(t=>t.property===a);goto('developers',{developer:d.developer});}})));
  add('Employees',S.employees.filter(e=>JSON.stringify(e).toLowerCase().includes(q)).map(e=>({l:e.name,s:e.title||'',go:()=>viewEmployee(e.id)})));
  add('Clients / Units / Invoices',all.filter(t=>[t.client,t.unit,t.invoice].some(x=>x&&String(x).toLowerCase().includes(q))).map(t=>({l:`${t.client||'—'} · ${t.unit||''} · ${t.invoice||''}`,s:`${t.agent} · ${fmtDate(t.date)} · ${fmtCur(t.net)}`,go:()=>goto('agents',{agent:t.agent})})));
  if(!grp.length){box.innerHTML='<div class="empty">No matches.</div>';return box.classList.add('open');}S._search=grp;box.innerHTML=grp.map((g,gi)=>`<div class="grp">${g.t}</div>`+g.items.map((it,ii)=>`<div class="it" data-g="${gi}" data-i="${ii}"><span>${esc(it.l)}</span><small>${esc(it.s)}</small></div>`).join('')).join('');box.classList.add('open');}
$('#gsearch').oninput=debounce(e=>globalSearch(e.target.value),200);$('#gsearch').onclick=e=>e.stopPropagation();
$('#gresults').onclick=e=>{const it=e.target.closest('.it');if(!it)return;S._search[+it.dataset.g].items[+it.dataset.i].go();$('#gresults').classList.remove('open');$('#gsearch').value='';};
function applyTheme(){document.documentElement.dataset.theme=S.settings.theme||'light';$('#brandName').textContent=S.settings.company||'Novara Properties';$('#brandLogo').innerHTML=S.settings.logo?`<img src="${S.settings.logo}">`:(S.settings.company||'N')[0];if(S.data)renderPage();}
$('#themeBtn').onclick=async()=>{S.settings.theme=S.settings.theme==='dark'?'light':'dark';await DB.put('settings',{id:'app',...S.settings});applyTheme();};
function afterDataLoad(){const m=S.data.meta;$('#hdrMeta').innerHTML=`<b>${esc(m.sourceFile)}</b><br>Data updated: ${new Date(m.generatedAt).toLocaleString('en-GB',{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'})}`;$('#sideFoot').innerHTML=`${fmtNum(m.quality.valid)} transactions<br>${fmtDate(m.dateRange.from)} → ${fmtDate(m.dateRange.to)}`;const n=alerts().filter(a=>a.k==='CRITICAL'||a.k==='WARNING').length;const b=$('#alertBadge');b.style.display=n?'':'none';b.textContent=n;buildFilters();renderPage();}
function renderPage(){const act=$('#page-'+S.page);Object.keys(S.charts).forEach(k=>{const e=document.getElementById(k);if(!e||!act.contains(e)){S.charts[k].dispose();delete S.charts[k];}});const p=S.page;try{({dashboard:()=>{renderDashboard();if(T().length){const t=targetsHtml();if(t)$('#kpis').insertAdjacentHTML('afterend',t);}},teams:renderTeams,developers:renderDevelopers,agents:renderAgents,leaderboard:renderLeaderboard,alerts:renderAlerts,employees:renderEmployees,org:renderOrg,data:renderData,settings:renderSettings})[p]();}catch(e){console.error(e);$('#page-'+p).innerHTML=`<div class="card"><div class="empty">Something went wrong rendering this page.<br><span class="hint">${esc(e.message)}</span></div></div>`;}setTimeout(resizeCharts,30);}

(async function init(){
  $('#todayLbl').textContent=new Date().toLocaleDateString('en-GB',{weekday:'short',day:'2-digit',month:'short',year:'numeric'});
  await DB.open();
  const st=(await DB.getAll('settings')).find(x=>x.id==='app');if(st){const{id,...rest}=st;S.settings={...S.settings,...rest};}
  S.employees=await DB.getAll('employees');S.mappings=Object.fromEntries((await DB.getAll('mappings')).map(m=>[m.id,m.empId]));S.targets=await DB.getAll('targets');
  const g=(await DB.getAll('github')).find(x=>x.id==='cfg');if(g){const{id,...rest}=g;S.github=rest;}
  applyTheme();
  // data.json (from convert.py / GitHub) takes precedence; else last uploaded Excel from IndexedDB
  let loaded=false;try{const r=await fetch('data.json',{cache:'no-store'});if(r.ok){const j=await r.json();if(j&&j.transactions){S.data=j;loaded=true;}}}catch(e){}
  if(!loaded){const c=(await DB.getAll('sales')).find(x=>x.id==='current');if(c){S.data=c.data;loaded=true;}}
  if(loaded){if(S.settings.defaultYear&&T().some(t=>yearOf(t.date)===+S.settings.defaultYear))S.filters.years=[+S.settings.defaultYear];afterDataLoad();}else{$('#hdrMeta').innerHTML='No data loaded';renderPage();}
})();
</script>
</body>
